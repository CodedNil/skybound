[package]
name = "skybound"
version = "0.1.0"
edition = "2024"

# The shaders are this same crate compiled to SPIR-V without default
# features, so everything that only runs on the host sits behind `desktop`.
[features]
default = ["desktop"]
desktop = ["dep:bevy", "dep:rayon", "dep:half", "dep:serde_json"]
# Builds the shader with only the previewer's entry point; set by build.rs, never by hand.
preview = []

[[bin]]
name = "skybound"
required-features = ["desktop"]

[[example]]
name = "species_preview"
required-features = ["desktop"]

# rust-gpu builds shader crates as dylibs; the game links the rlib.
[lib]
crate-type = ["dylib", "lib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
spirv-std = { version = "0.11.0", features = ["bytemuck"] }
bevy = { optional = true, git = "https://github.com/bevyengine/bevy", rev = "3a796854abd94144c6e08c4112e5bd9229392b37", default-features = false, features = [
    "wayland",
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_anti_alias",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_post_process",
    "bevy_window",
    "bevy_render",
    "shader_format_spirv",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "dlss",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "zstd_rust",
] }
rayon = { version = "1.12.0", optional = true }
half = { version = "2.7.1", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
wgpu = { version = "30.0.1", features = ["spirv"] }
futures-lite = "2.6.1"
webp-animation = "0.10.0"

[build-dependencies]
spirv-builder = "0.11.0"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_arch, values("spirv"))',
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

needless_pass_by_value = "allow"
large_types_passed_by_value = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
suboptimal_flops = "allow"

absolute_paths = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
float_cmp_const = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
iter_over_hash_type = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
needless_raw_strings = "warn"
non_zero_suggestions = "warn"
panic_in_result_fn = "warn"
precedence_bits = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
semicolon_inside_block = "warn"
separated_literal_suffix = "warn"
str_to_string = "warn"
string_add = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
unimplemented = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"

[profile.release]
lto = true

[profile.dev]
opt-level = 3
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
dlss_wgpu = { path = "vendor/dlss_wgpu" }
