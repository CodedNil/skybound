[package]
name = "skybound"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dep:bevy", "dep:image", "dep:rayon", "dep:half"]

[[bin]]
name = "skybound"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "species_preview"
required-features = ["desktop"]

[lib]
crate-type = ["dylib", "lib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
spirv-std = { version = "0.10.0", features = ["bytemuck"] }

bevy = { optional = true, version = "0.20.0-rc.2", default-features = false, features = [
    "wayland",
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_anti_alias",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_post_process",
    "bevy_window",
    "bevy_render",
    "shader_format_spirv",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "hdr",
    "multi_threaded",
    "tonemapping_luts",
    "zstd_rust",
] }
image = { optional = true, version = "0.25.10", default-features = false, features = ["png"] }
rayon = { version = "1.12.0", optional = true }
half = { version = "2.7.1", optional = true }

[build-dependencies]
spirv-builder = "0.10.0"

[dev-dependencies]
naga = { version = "29.0.4", features = ["spv-in"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_arch, values("spirv"))',
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

needless_pass_by_value = "allow"
large_types_passed_by_value = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
suboptimal_flops = "allow"

absolute_paths = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exit = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
iter_over_hash_type = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
non_zero_suggestions = "warn"
panic_in_result_fn = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
semicolon_inside_block = "warn"
separated_literal_suffix = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"

[profile.release]
incremental = true
codegen-units = 256
lto = true

[profile.release.build-override]
opt-level = 3
incremental = true
codegen-units = 256

[profile.dev]
opt-level = 1
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
